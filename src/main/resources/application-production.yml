server:
  port: 9000

logging:
  level:
    org.springframework.security: info

spring:
  data:
    redis:
      host: redis
      port: 6379
      username:
      password:
  cache:
    type: redis
    redis:
      time-to-live: 60000
  threads:
    virtual:
      enabled: true
  application:
    name: store-authentication-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:
    username:
    password:
    hikari:
      auto-commit: true
      maximum-pool-size: 2
      pool-name: authorization-db-pool
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    database: mysql
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        hbm2ddl:
          auto: update
        format_sql: false
    defer-datasource-initialization: true

multistore:
  config:
    allowed-origins:
      - http://localhost:4200
    location: http://localhost:9000/auth


